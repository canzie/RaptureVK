<!doctype html>
<!--
    Proposal: Add Component in the Properties panel, on the Lantern root of the Module workspace.
    A window of its own over the editor, moved by dragging its title bar: a search field and a row per component.
    A click on a row adds it; the small button at the row's end opens a longer description under it.
    It closes once a component is added, on Escape, and on a click outside it.
    Render: tools/ui_mock/render.sh add_component.html ""
-->
<html>
<head>
<meta charset="utf-8">
<script src="icons.js"></script>
<script src="workspace_chrome.js"></script>
<link rel="stylesheet" href="sweep.css">
<link rel="stylesheet" href="workspaces.css">
<style>
.properties-bar { position: absolute; left: 8px; right: 8px; top: 8px; height: 26px; display: flex; gap: 6px; }
.properties-bar .search { position: relative; flex: 1; }
.properties-bar .tool-button { height: 26px; padding: 0 9px; background: var(--bg-buttons); border: 1px solid var(--border-4); color: var(--text-1);
    font-size: var(--small-text-size); }
.properties-bar .tool-button.open { background: var(--hover); }


.add-component-dialog { position: absolute; width: 560px; background: var(--bg-panel); border: 1px solid var(--border-4);
    border-radius: 6px; z-index: 15; display: flex; flex-direction: column; overflow: hidden; }
.add-component-dialog .title-bar { height: 38px; flex: none; display: flex; align-items: center; padding: 0 10px 0 14px; background: var(--bg-header);
    border-bottom: 1px solid var(--border-4); font-weight: 700; color: var(--text-1); }
.add-component-dialog .title-bar .target { margin-left: 8px; font-weight: 400; color: var(--text-3); font-size: var(--small-text-size); }
.add-component-dialog .title-bar .icon-button { position: static; margin-left: auto; }
.add-component-dialog .main { flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.add-component-dialog .search { position: relative; flex: none; border-color: var(--accent); }
.add-component-dialog .rows { display: flex; flex-direction: column; }
.add-component-dialog .row { height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: var(--control-radius); }
.add-component-dialog .row:hover { background: var(--hover); }
.add-component-dialog .row .icon { width: 14px; height: 14px; color: var(--text-2); }
.add-component-dialog .row .name { width: 130px; flex: none; color: var(--text-1); }
.add-component-dialog .row .description { color: var(--text-3); font-size: var(--caption-size); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.add-component-dialog .row.attached .icon, .add-component-dialog .row.attached .name,
.add-component-dialog .row.attached .description { color: var(--text-4); }
.add-component-dialog .row .expand { margin-left: auto; width: 22px; height: 22px; flex: none; display: flex; align-items: center; justify-content: center;
    border-radius: var(--control-radius); color: var(--text-3); }
.add-component-dialog .row .expand:hover { background: var(--bg-buttons); color: var(--text-1); }
.add-component-dialog .row .expand .icon { width: 11px; height: 11px; color: inherit; }
.add-component-dialog .row.hovered { background: var(--hover); }
.add-component-dialog .details { margin: 0 0 4px 32px; padding: 4px 8px 8px; border-left: 1px solid var(--border-4); }
.add-component-dialog .details .text { color: var(--text-2); font-size: var(--small-text-size); line-height: 1.4; }
</style>
</head>
<body>
<script>
// [icon, name, kind, description, attached]
const COMPONENTS = [
    ["CUBE", "Rigid Body", "Physics", "Moved by physics, pushed by forces and collisions", true],
    ["CONTROLLER", "Character Body", "Physics", "Walks, jumps and collides, moved by a controller", false],
    ["SCRIPT", "Script", "Scripting", "Runs a Lua script with this object as its owner", true],
    ["TAG", "Attributes", "Scripting", "Named values put on this object", false],
    ["EYE", "Visibility", "Display", "Where this object is shown", false],
];
const KINDS = [...new Set(COMPONENTS.map(c => c[2]))];

const DESCRIPTIONS = {
    "Rigid Body": "The object is simulated: gravity, forces and collisions move it, and the simulation writes its transform back.",
    "Character Body": "The object walks, jumps and collides under a controller instead of being pushed around by the simulation.",
    "Script": "Runs a Lua script with this object as its owner, connected to its events while the world plays.",
    "Attributes": "Named values put on this object that scripts can read and write.",
    "Visibility": "Where this object is shown, such as whether the outliner lists it.",
};
const HOVERED = "Character Body";

const PROPERTIES_BOX = [1306, 474, 602, 542];
const ADD_BUTTON_BOTTOM = PROPERTIES_BOX[1] + 30 + 8 + 26;
const DIALOG_WIDTH = 560;

function viewportBody() {
    return `<div class="stage"></div>
        <div class="overlay-toolbar" style="left:14px;top:14px">
            <div class="tool-button">${icon("TRANSFORM")}Transform${icon("CHEVRON_DOWN", "caret")}</div>
            <div class="tool-button">${icon("PERSPECTIVE")}Lit${icon("CHEVRON_DOWN", "caret")}</div></div>`;
}

function treeBody() {
    const rows = [[0, "MESH", "Lantern", "StaticMesh3D"], [1, "MESH", "Glass", "StaticMesh3D"], [1, "LIGHT", "Flame", "PointLight3D"],
        [1, "MESH", "Handle", "StaticMesh3D"]].map(([depth, iconName, name, type], r) =>
        `<div class="tree-row ${r === 0 ? "selected" : ""}" style="top:${64 + r * 24}px"><span style="width:${26 + depth * 16}px;flex:none"></span>
            ${icon(iconName, "tree-icon")}<span>${name}</span><span class="type">${type}</span></div>`).join("");
    return `<div class="search" style="left:8px;right:8px;top:8px">${icon("SEARCH")}Search</div>${rows}`;
}

function propertiesBody() {
    const sheet = new PropertySheet(42);
    sheet.html = `<div class="properties-bar"><div class="search">${icon("SEARCH")}Search properties</div>
        <div class="tool-button">${icon("PLUS")}Add Component</div></div>`;
    sheet.header("Transform", "TRANSFORM", false)
        .row("Translation", vectorFields(["0.000", "0.000", "0.000"]))
        .row("Rotation", vectorFields(["0.000", "0.000", "0.000"]))
        .row("Scale", vectorFields(["1.000", "1.000", "1.000"]));
    sheet.header("Static Mesh", "MESH", false)
        .row("Mesh", assetPicker("linear-gradient(135deg, #55595F, #2A2C30)", "SM_Lantern", "Static mesh"), {height: 52});
    sheet.header("Rigid Body", "CUBE", true).row("Mass", slider("2.400 kg", 0.24));
    sheet.header("Script", "SCRIPT", true).row("Script", assetPicker("linear-gradient(135deg, #2E4A52, #1E2C30)", "TorchFlicker.lua", "Script"), {height: 52});
    return sheet.html;
}

function componentDetails(name) {
    return `<div class="details"><div class="text">${DESCRIPTIONS[name]}</div></div>`;
}

// each row carries a button that opens its description below it, a click on the row itself adds it
function addComponentDialog() {
    const rows = COMPONENTS.map(([iconName, name, , description, attached]) => {
        const open = name === HOVERED;
        return `<div class="row ${attached ? "attached" : ""} ${open ? "hovered" : ""}">${icon(iconName)}<span class="name">${name}</span>
            <span class="description">${attached ? "Already attached" : description}</span>
            <span class="expand">${icon(open ? "CHEVRON_DOWN" : "CARET_RIGHT")}</span></div>${open ? componentDetails(name) : ""}`;
    }).join("");
    const left = (1908 - DIALOG_WIDTH) / 2;
    return `<div class="add-component-dialog" id="add-component" style="left:${left}px;top:300px">
        <div class="title-bar">Add Component<span class="target">to Lantern</span><span class="icon-button">${icon("X")}</span></div>
        <div class="main"><div class="search">${icon("SEARCH")}Search components</div><div class="rows">${rows}</div></div></div>`;
}

// dragging the title bar moves the window
function makeDraggable(dialog) {
    const bar = dialog.querySelector(".title-bar");
    bar.style.cursor = "move";
    bar.addEventListener("mousedown", down => {
        const start = [down.clientX - dialog.offsetLeft, down.clientY - dialog.offsetTop];
        const move = e => { dialog.style.left = `${e.clientX - start[0]}px`; dialog.style.top = `${e.clientY - start[1]}px`; };
        const up = () => { document.removeEventListener("mousemove", move); document.removeEventListener("mouseup", up); };
        document.addEventListener("mousemove", move);
        document.addEventListener("mouseup", up);
        down.preventDefault();
    });
}

document.body.innerHTML = windowChrome([["SCENE", "world", "DefaultWorld"], ["CUBE", "module", "Lantern"]], [
        hotbarGroup(`<div class="primary-button">${icon("PLUS")}Add</div>`),
        hotbarGroup(`<div class="tool-button">${icon("SAVE")}Save</div>`),
    ]) +
    panel("viewport", [0, 108, 1300, 908], [{icon: "VIEWPORT", label: "Viewport"}], viewportBody()) +
    panel("tree", [1306, 108, 602, 360], [{icon: "LAYERS", label: "Scene Objects"}], treeBody()) +
    panel("properties", PROPERTIES_BOX, [{icon: "PROPERTIES", label: "Properties"}], propertiesBody()) + bottomBar() +
    addComponentDialog();
makeDraggable(document.getElementById("add-component"));
</script>
</body>
</html>
